name: Publish Release

on:
  push:
    branches: [main]
    paths:
      - "Flow.Launcher.Plugin.Zoxide/plugin.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Get version from plugin.json
        id: version
        uses: notiz-dev/github-action-json-property@release
        with:
          path: Flow.Launcher.Plugin.Zoxide/plugin.json
          prop_path: Version

      - name: Build and package
        run: |
          dotnet publish 'Flow.Launcher.Plugin.Zoxide/Flow.Launcher.Plugin.Zoxide.csproj' -r win-x64 -c Release -o "Flow.Launcher.Plugin.Zoxide-${{ steps.version.outputs.prop }}"
          7z a -tzip "Flow.Launcher.Plugin.Zoxide-${{ steps.version.outputs.prop }}.zip" "./Flow.Launcher.Plugin.Zoxide-${{ steps.version.outputs.prop }}/*"
          rm -r "Flow.Launcher.Plugin.Zoxide-${{ steps.version.outputs.prop }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Flow.Launcher.Plugin.Zoxide*.zip
          tag_name: v${{ steps.version.outputs.prop }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
